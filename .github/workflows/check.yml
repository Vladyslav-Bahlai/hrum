# Проверка на настоящих ОС: Android-эмулятор и iOS-симулятор (демо-данные, сценарии Maestro, скриншоты в Artifacts).
# Только ветка ci-check; в обычную сборку демо-режим не попадает (EXPO_PUBLIC_DEMO задаётся только здесь).
name: Device check
on:
  push:
    branches: [ci-check]
  workflow_dispatch:
env:
  EXPO_PUBLIC_DEMO: '1'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package-lock.json') }}
      - name: Build APK (x86_64 для эмулятора)
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .maestro/run-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-android
          path: shots/android
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: cd ios && pod install
      - name: Build for simulator
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
      - run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - run: bash .maestro/run-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-ios
          path: shots/ios
